<title>Quilt Picture Check</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
/>
<style>
  /* Layout: a review sheet. Per format version, one card per picture: release, now, difference. */
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --fg: #1d2330;
    --muted: #5b6475;
    --line: #d7dbe3;
    --accent: #2f4a8a;
    --same: #2e7d4f;
    --same-bg: #e3f2e8;
    --changed: #b42318;
    --changed-bg: #fde7e4;
    --mat: #e9efe6;
    --mat-grid: #cfdacb;
    --body: 'Libre Franklin', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #141820;
      --panel: #1c212b;
      --fg: #e6e9ef;
      --muted: #9aa3b5;
      --line: #2e3542;
      --accent: #9db4ec;
      --same: #7fd3a0;
      --same-bg: #1d3328;
      --changed: #ff9b8f;
      --changed-bg: #3d211f;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #141820;
    --panel: #1c212b;
    --fg: #e6e9ef;
    --muted: #9aa3b5;
    --line: #2e3542;
    --accent: #9db4ec;
    --same: #7fd3a0;
    --same-bg: #1d3328;
    --changed: #ff9b8f;
    --changed-bg: #3d211f;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 var(--body);
  }
  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    gap: 24px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0;
    text-wrap: balance;
  }
  .lede {
    color: var(--muted);
    margin: 4px 0 0;
    max-width: 65ch;
  }
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
  }
  .bar label {
    display: flex;
    gap: 8px;
    align-items: center;
    cursor: pointer;
  }
  .bar a {
    color: var(--accent);
  }
  section {
    display: grid;
    gap: 16px;
  }
  h2 {
    font-size: 1.15rem;
    margin: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  h2 small {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.85rem;
    margin-left: 8px;
  }
  .pic {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    display: grid;
    gap: 10px;
  }
  .pic header {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    align-items: center;
  }
  .pic h3 {
    margin: 0;
    font-size: 1rem;
    flex: 1;
    min-width: 0;
  }
  .ref {
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    user-select: all;
  }
  .chip {
    font-size: 0.8rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
  }
  .chip.same {
    color: var(--same);
    background: var(--same-bg);
  }
  .chip.changed,
  .chip.new,
  .chip.missing {
    color: var(--changed);
    background: var(--changed-bg);
  }
  .pic.changed,
  .pic.new,
  .pic.missing {
    border-color: var(--changed);
  }
  .trio {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
    gap: 12px;
  }
  figure {
    margin: 0;
    display: grid;
    gap: 4px;
  }
  /* Pictures sit on a light cutting mat in both themes, so release and now compare alike. */
  figure img,
  figure.none div {
    width: 100%;
    aspect-ratio: 1;
    object-fit: contain;
    background-color: var(--mat);
    background-image:
      linear-gradient(var(--mat-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--mat-grid) 1px, transparent 1px);
    background-size: 24px 24px;
    border-radius: 4px;
  }
  figure.none div {
    display: grid;
    place-items: center;
    color: #5b6475;
  }
  figcaption {
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  body.only-changed .pic.same {
    display: none;
  }
  input:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>

<div class="wrap">
  <header>
    <h1>Quilt Picture Check</h1>
    <p class="lede">
      The demo projects drawn by today's build ({{BUILD}}) beside the pictures saved when each
      format version was released. Red in the difference column marks what moved. Tell Claude the
      reference (like <span class="ref">v6.03</span>) of anything that looks wrong.
    </p>
  </header>
  <div class="bar">
    <span class="chip {{STATE}}">{{SUMMARY}}</span>
    <label for="only"><input id="only" type="checkbox" /> Show changed only</label>
    <nav id="jump" class="bar"></nav>
  </div>
  {{SECTIONS}}
</div>
<script>
  const box = document.getElementById('only');
  box.addEventListener('change', () => document.body.classList.toggle('only-changed', box.checked));
  const jump = document.getElementById('jump');
  document.querySelectorAll('section h2').forEach((h, i) => {
    h.id = 'version' + i;
    const a = document.createElement('a');
    a.href = '#version' + i;
    a.textContent = h.firstChild.textContent.trim().replace('Project format ', '');
    jump.append(a);
  });
</script>
